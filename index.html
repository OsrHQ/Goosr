<title>ميزان الجولة</title>
<style>
/* Layout: one phone screen. Coin tabs, the round card (clock, leading side, chart), the price rule, and the balance strip. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --sunk: #e3e8ed; --line: #d3dae1;
  --ink: #142029; --muted: #5a6977; --accent: #285f8f; --seg-on: #ffffff;
  --up: #157a43; --up-soft: #dcf1e5; --down: #c2362b; --down-soft: #f8e0dd;
  --warn: #9a5b00; --warn-soft: #fbecd2; --stop: #b3261e; --stop-soft: #f9dcd9; --good: #146c43; --good-soft: #d9efe3;
  --font: -apple-system, "SF Arabic", "SF Pro Text", "Geeza Pro", "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151c; --surface: #16202a; --sunk: #1d2934; --line: #2a3845;
    --ink: #e5ecf2; --muted: #93a4b4; --accent: #7fb1df; --seg-on: #2c3d4e;
    --up: #4fd18b; --up-soft: #173528; --down: #f27b70; --down-soft: #3a1f1d;
    --warn: #f0b354; --warn-soft: #3a2c14; --stop: #ff8a80; --stop-soft: #43201e; --good: #5fd39a; --good-soft: #163527;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151c; --surface: #16202a; --sunk: #1d2934; --line: #2a3845;
  --ink: #e5ecf2; --muted: #93a4b4; --accent: #7fb1df; --seg-on: #2c3d4e;
  --up: #4fd18b; --up-soft: #173528; --down: #f27b70; --down-soft: #3a1f1d;
  --warn: #f0b354; --warn-soft: #3a2c14; --stop: #ff8a80; --stop-soft: #43201e; --good: #5fd39a; --good-soft: #163527;
  color-scheme: dark;
}
html { scroll-padding-top: 80px; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
* { box-sizing: border-box; }
.app { max-width: 480px; margin: 0 auto; padding-block: 12px 28px; display: flex; flex-direction: column; gap: 12px; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; unicode-bidi: isolate; direction: ltr; display: inline-block; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 480px; margin: 0 auto; padding-block: 8px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--sunk); padding: 4px; border-radius: 12px; position: relative; }
.tabs input { position: absolute; opacity: 0; pointer-events: none; }
.tabs label { text-align: center; padding: 6px 4px; border-radius: 9px; cursor: pointer; font-weight: 700; font-size: 16px; color: var(--muted); line-height: 1.25; }
.tabs label small { display: block; font-size: 13px; font-weight: 600; }
.tabs label small.up { color: var(--up); }
.tabs label small.down { color: var(--down); }
.tabs input:checked + label { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12), inset 0 0 0 1px var(--line); }
.tabs input:focus-visible + label { outline: 2px solid var(--accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.title { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
.title b { font-size: 17px; }
.title small { color: var(--muted); font-size: 13px; }
#lockLbl { color: var(--warn); font-weight: 600; }
.clock { font-size: 36px; font-weight: 800; line-height: 1; }
.clock.late { color: var(--down); }
.conn { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.conn.on i { background: var(--up); }
.conn.off i { background: var(--down); }

.lead { border-radius: 14px; padding: 14px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--sunk); }
.lead span { font-size: 15px; font-weight: 600; }
.lead b { font-size: 64px; font-weight: 800; line-height: 1.05; }
.lead em { font-style: normal; font-size: 13.5px; color: var(--muted); }
.lead.up { background: var(--up-soft); color: var(--up); }
.lead.down { background: var(--down-soft); color: var(--down); }
.lead.up em, .lead.down em { color: inherit; opacity: .85; }
.gapline { margin: 0; font-size: 15px; text-align: center; }
.gapline b.pos { color: var(--up); }
.gapline b.neg { color: var(--down); }
#spark { width: 100%; height: 100px; display: block; border-radius: 10px; background: var(--sunk); }

.rule { display: flex; flex-direction: column; gap: 8px; }
.rule h2 { margin: 0; font-size: 16px; }
.rule p { margin: 0; font-size: 13.5px; color: var(--muted); }
.line { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--sunk); font-size: 16px; }
.line b { font-size: 22px; font-weight: 800; }
.line.up b { color: var(--up); }
.line.down b { color: var(--down); }
.line.no b { color: var(--muted); font-size: 16px; font-weight: 600; }
.msg { border-radius: 12px; padding: 12px 14px; font-size: 15px; background: var(--sunk); }
.msg b { display: block; font-size: 18px; }
.msg.warn { background: var(--warn-soft); color: var(--warn); }
.msg.stop { background: var(--stop-soft); color: var(--stop); }
.msg.good { background: var(--good-soft); color: var(--good); }

.bank { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.flabel { font-size: 13px; font-weight: 600; }
.decision { border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px; background: var(--sunk); border: 2px solid var(--line); }
.decision b { font-size: 26px; font-weight: 800; line-height: 1.2; }
.decision span { font-size: 14.5px; }
.decision.go { background: var(--good-soft); border-color: var(--good); }
.decision.go b { color: var(--good); }
.decision.sell { background: var(--warn-soft); border-color: var(--warn); }
.decision.sell b { color: var(--warn); }
.decision.no b { color: var(--muted); }
.decision.stop { background: var(--stop-soft); border-color: var(--stop); }
.decision.stop b { color: var(--stop); }
.rulemini { margin: 0; font-size: 13px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; }
.inwrap { position: relative; }
.inwrap span { position: absolute; top: 50%; transform: translateY(-50%); right: 10px; color: var(--muted); pointer-events: none; }
input[type="text"] { font: inherit; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; direction: ltr; text-align: left; width: 100%; min-width: 0; padding: 8px 28px 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--sunk); color: var(--ink); }
input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--sunk); padding: 4px; border-radius: 10px; position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { text-align: center; padding: 7px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg input:checked + label { background: var(--seg-on); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.seg input:checked + label.up { color: var(--up); }
.seg input:checked + label.down { color: var(--down); }
.livelink { font-size: 14px; margin: 0; }
.livelink a { color: var(--accent); }
footer { color: var(--muted); font-size: 12.5px; text-align: center; }
@media (max-width: 350px) { .lead b { font-size: 52px; } .clock { font-size: 30px; } }
</style>
</head>
<body>
<div class="bar pad" dir="rtl" lang="ar">
  <div class="bar-in">
    <div class="tabs" role="radiogroup" aria-label="العملة">
      <input type="radio" name="coin" id="cBTC" value="BTC" checked><label for="cBTC">BTC<small id="tabBTC">–</small></label>

</div>

<main class="app pad" dir="rtl" lang="ar">
  <section class="card" aria-labelledby="ttl">
    <div class="top">
      <div class="title">
        <b id="ttl">BTC · جولة –</b>
        <small id="lockLbl"></small>
        <span id="conn" class="conn"><i></i><span id="connTxt">…</span></span>
      </div>
      <b id="clock" class="clock num">--:--</b>
    </div>

    <div id="lead" class="lead" aria-live="polite">
      <span id="leadName">الأقرب</span>
      <b id="leadPct" class="num">–</b>
      <em id="leadOther"></em>
    </div>
    <p class="gapline" id="gapLine">…</p>
    <canvas id="spark" aria-label="حركة السعر في الجولة مقارنة بسعر البداية" hidden></canvas>

    <div id="manual" hidden>
      <div class="bank">
        <div class="seg" role="radiogroup" aria-label="السعر الحالي مقارنة بسعر البداية">
          <input type="radio" name="dir" id="dirAbove" value="above"><label for="dirAbove" class="up">فوق ↑</label>
          <input type="radio" name="dir" id="dirBelow" value="below" checked><label for="dirBelow" class="down">تحت ↓</label>
        </div>
        <div class="inwrap"><input type="text" id="diff" inputmode="decimal" autocomplete="off" placeholder="الفرق" aria-label="الفرق بالدولار"><span>$</span></div>
      </div>

  </section>

  <section class="card" aria-label="القرار">

      <input type="radio" name="mode" id="mHold" value="hold"><label for="mHold">عندي صفقة</label>
    </div>

      <div class="field"><label for="upQ">سعر Up (طالع) في التطبيق</label><div class="inwrap"><input type="text" id="upQ" inputmode="decimal" autocomplete="off" placeholder="40"><span>%</span></div></div>
      <div class="field"><label for="dnQ">سعر Down (نازل) في التطبيق</label><div class="inwrap"><input type="text" id="dnQ" inputmode="decimal" autocomplete="off" placeholder="60"><span>%</span></div></div>
    </div>

          <input type="radio" name="hside" id="hDn" value="down" checked><label for="hDn" class="down">Down (نازل)</label>
        </div>
      </div>
      <div class="field"><label for="sellQ">سعر البيع في Sell</label><div class="inwrap"><input type="text" id="sellQ" inputmode="decimal" autocomplete="off" placeholder="55"><span>%</span></div></div>
    </div>
    <div id="decision" class="decision" aria-live="polite"><b id="dTitle">…</b><span id="dBody"></span></div>

  <section class="card" aria-labelledby="h-bank">

      <div class="field"><label for="goal">هدفي</label><div class="inwrap"><input type="text" id="goal" inputmode="decimal" autocomplete="off" value="100"><span>$</span></div></div>
    </div>

  <p class="livelink" id="liveLink" hidden>النسخة اللايف افتحها في Safari: <a href="https://osrhq.github.io/Goosr/" target="_blank" rel="noopener">osrhq.github.io/Goosr</a></p>
  <footer>الفرصة محسوبة من حركة سعر Binance. ما تعرف وين بيروح السعر، ولا أحد يعرف.</footer>

<script>
const PARAMS = {
  coins: { BTC: { sigma: 30 }, ETH: { sigma: 1.17 }, BNB: { sigma: 0.29 } },  // usual move per minute (60-day median)
  edgeMin: 0.08,        // the model's error band: a side is only worth it this far below its chance
  fee: 0.004,
  buyCloseSec: 30, sellCloseSec: 60,
  staleSec: 15,         // app prices typed longer ago than this are too old
};

/* ---------- math ---------- */
const Mizan = (() => {
  const ROUND_MS = 300000;
  function erf(x) { const s = x < 0 ? -1 : 1; x = Math.abs(x); const t = 1 / (1 + 0.3275911 * x); return s * (1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x)); }
  const phi = x => 0.5 * (1 + erf(x / Math.SQRT2));
  function probUp(diff, tLeft, sigma) { if (!isFinite(diff)) return NaN; if (!(tLeft > 0)) return diff >= 0 ? 1 : 0; if (!(sigma > 0)) return NaN; return phi(diff / (sigma * Math.sqrt(tLeft / 60))); }
  const roundStart = ms => Math.floor(ms / ROUND_MS) * ROUND_MS;
  const roundEnd = ms => roundStart(ms) + ROUND_MS;
  function sigmaFromCloses(c) { const r = []; for (let i = 1; i < c.length; i++) if (c[i] > 0 && c[i - 1] > 0) r.push(Math.log(c[i] / c[i - 1])); if (r.length < 10) return NaN; const m = r.reduce((a, b) => a + b, 0) / r.length; return Math.sqrt(r.reduce((a, b) => a + (b - m) ** 2, 0) / (r.length - 1)) * c[c.length - 1]; }
  function parseNum(s) { if (s == null) return NaN; let t = String(s).trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); t = t.replace(/[^\d.,٫،]/g, ''); if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(t)) t = t.replace(/,/g, ''); t = t.replace(/[٫,،]/g, '.'); if ((t.match(/\./g) || []).length > 1) return NaN; return (t === '' || t === '.') ? NaN : parseFloat(t); }
  // highest app price (0..1) at which a side with chance p is still worth buying
  const maxPrice = p => (p - PARAMS.edgeMin) * (1 - PARAMS.fee);
  // in a fair game no way of betting beats balance/goal; fees make it lower
  const reachOdds = (bal, goal) => (bal > 0 && goal > bal) ? bal / goal : NaN;
  const pctP = x => !isFinite(x) ? '–' : x < 0.01 ? '<1%' : x > 0.99 ? '>99%' : Math.round(x * 100) + '%';
  const isoP = x => '\u2066' + pctP(x) + '\u2069';
  const isoD = x => '\u2066$' + (Math.round(x * 100) / 100) + '\u2069';
  const isoS = x => '\u2066' + (x < 0 ? '−' : '+') + '$' + (Math.round(Math.abs(x) * 100) / 100).toFixed(2).replace(/\.00$/, '') + '\u2069';
  function counted(n, one, two, few, many) { n = Math.round(n); return n === 1 ? one : n === 2 ? two : (n >= 3 && n <= 10) ? n + ' ' + few : n + ' ' + many; }
  const secs = n => counted(n, 'ثانية', 'ثانيتين', 'ثواني', 'ثانية');
  // stake: a quarter of the Kelly fraction, never above 10% of the balance, at least the app's $1
  function stake(p, cost, bal) {
    if (!(bal > 0) || !(cost > 0 && cost < 1)) return 0;
    const kelly = Math.max(0, (p - cost) / (1 - cost));
    const a = Math.min(0.10 * bal, 0.25 * kelly * bal);
    return bal >= 1 ? Math.max(1, Math.floor(a)) : 0;
  }
  /* one decision. kind: go | sell | no | stop | wait */
  function decide(v) {
    const FEE = PARAMS.fee, M = PARAMS.edgeMin, HOLD_M = 0.05, STALE = PARAMS.staleSec;
    if (v.bal <= 0) return { kind: 'stop', title: 'وقّف', body: 'خلص الرصيد اللي حددته. لا تودع من جديد.' };
    if (v.bal >= v.goal) return { kind: 'stop', title: 'وصلت هدفك. اسحب', body: 'اسحب الحين ووقّف، قبل لا ترجع تلعب فيه.' };
    if (!v.ok) return { kind: 'wait', title: 'انتظر', body: v.wait || '' };
    if (v.mode === 'hold') {
      const p = v.side === 'up' ? v.pUp : 1 - v.pUp;
      const now = 'فرصة صفقتك الحين ' + isoP(p) + '.';
      if (v.tLeft < PARAMS.sellCloseSec) return { kind: 'no', title: 'البيع مقفل', body: 'الصفقة تكمل للنهاية. ' + now };
      if (!(v.sellQ > 0 && v.sellQ < 1)) return { kind: 'wait', title: 'اكتب سعر البيع', body: 'من زر Sell (بيع) في التطبيق. ' + now };
      if (v.sellAge > STALE) return { kind: 'wait', title: 'حدّث سعر البيع', body: 'كتبته قبل ' + secs(v.sellAge) + '. ' + now };
      const val = v.sellQ * (1 - FEE) - p;
      if (val >= HOLD_M) return { kind: 'sell', title: 'بيع الحين', body: 'السوق يدفع ' + isoP(v.sellQ) + ' وفرصتها ' + isoP(p) + '. البيع أحسن من الانتظار.' };
      if (val <= -HOLD_M) return { kind: 'no', title: 'خلها لين النهاية', body: 'فرصتها ' + isoP(p) + ' والبيع بـ' + isoP(v.sellQ) + ' أقل منها. بس تخسرها كلها في ' + isoP(1 - p) + ' من المرات.' };
      return { kind: 'no', title: 'على كيفك', body: 'البيع والانتظار تقريبًا نفس الشي. البيع يريحك من احتمال ' + isoP(1 - p) + ' إنها تروح كلها.' };
    }
    if (v.tLeft < PARAMS.buyCloseSec) return { kind: 'no', title: 'الشراء مقفل', body: 'انتظر الجولة الجاية.' };
    if (!(v.upQ > 0 && v.upQ < 1 && v.dnQ > 0 && v.dnQ < 1)) return { kind: 'wait', title: 'اكتب سعر Up وDown', body: 'من التطبيق، وأقولك ادخل ولا لا.' };
    if (Math.abs(v.upQ + v.dnQ - 1) > 0.06) return { kind: 'wait', title: 'راجع الأرقام', body: 'Up وDown مجموعهم لازم يقارب 100، مثل 40 و60.' };
    if (v.qAge > STALE) return { kind: 'wait', title: 'حدّث الأسعار', body: 'كتبتها قبل ' + secs(v.qAge) + '، والأسعار تتغير كل ثانية.' };
    const cUp = v.upQ / (1 - FEE), cDn = v.dnQ / (1 - FEE);
    const eUp = v.pUp - cUp, eDn = (1 - v.pUp) - cDn;
    const up = eUp >= eDn, e = up ? eUp : eDn, p = up ? v.pUp : 1 - v.pUp, q = up ? v.upQ : v.dnQ, c = up ? cUp : cDn;
    const name = up ? 'Up (طالع)' : 'Down (نازل)';
    if (e < M) return { kind: 'no', title: 'لا تدخل', body: 'السعر عادل: الفرصة والسعر قريبين من بعض. على المدى ما تكسب منها.' };
    if (p > 0.9) return { kind: 'no', title: 'لا تدخل', body: 'فرصتها فوق 90%، والحسبة هنا أضعف من السوق.' };
    const amt = stake(p, c, v.bal);
    const lock = v.tLeft < PARAMS.sellCloseSec ? ' وبعدها ما تقدر تبيع.' : '';
    const win = amt ? amt * (1 - FEE) / q - amt : 0;
    return { kind: 'go', side: up ? 'up' : 'down', amount: amt, title: 'ادخل ' + name + (amt ? ' بـ' + isoD(amt) : ''),
      body: (amt ? 'لو كسبت: ' + isoS(win) + ' · لو خسرت: ' + isoS(-amt) + '. ' : '') + 'سعره ' + isoP(q) + ' وفرصته ' + isoP(p) + ': تكسب في ' + isoP(p) + ' من المرات وتخسر في ' + isoP(1 - p) + '. مو مضمون.' + lock };
  }
  return { ROUND_MS, phi, probUp, roundStart, roundEnd, sigmaFromCloses, parseNum, maxPrice, reachOdds, pctP, isoP, stake, decide, secs };
})();
window.Mizan = Mizan;

/* ---------- live Binance feed (hosted page only) ---------- */
const LIVE = !!document.querySelector('meta[name="mizan-live"]');
const Live = (() => {
  const COINS = Object.keys(PARAMS.coins), coins = {};
  COINS.forEach(c => coins[c] = { last: NaN, round: 0, ptb: NaN, ptbOk: false, path: [], sigma: NaN, sigmaAt: 0, loading: 0 });
  const HOSTS = ['wss://data-stream.binance.vision/stream?streams=', 'wss://stream.binance.com:9443/stream?streams='];
  const REST = 'https://data-api.binance.vision/api/v3/';
  let ws = null, hostIdx = 0, retry = 0, connected = false, connectedSince = Infinity, lastMsgAt = 0, offset = 0, started = false;
  const now = () => Date.now() + offset;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function getJSON(path) { const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 8000); try { const r = await fetch(REST + path, { cache: 'no-store', signal: ctl.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); } finally { clearTimeout(tm); } }
  async function syncTime() { try { const t0 = Date.now(); const j = await getJSON('time'); const t1 = Date.now(); if (j && j.serverTime) offset = j.serverTime - (t0 + t1) / 2; } catch (e) {} }
  async function loadRound(c, R) {
    const k = coins[c]; if (k.loading === R) return; k.loading = R;
    for (let a = 0; a < 4; a++) {
      try {
        const rows = await getJSON('klines?symbol=' + c + 'USDT&interval=1s&startTime=' + R + '&limit=300');
        if (k.round !== R) break;
        if (rows.length && rows[0][0] < R + 3000) { k.ptb = +rows[0][1]; k.ptbOk = true; }
        const first = k.path.length ? k.path[0][0] : Infinity;
        k.path = rows.map(r => [r[0] + 999, +r[4]]).filter(p => p[0] < first).concat(k.path);
        break;
      } catch (e) { await sleep(700 * (a + 1)); }
    }
    if (k.loading === R) k.loading = 0;
  }
  async function loadSigma(c) { try { const rows = await getJSON('klines?symbol=' + c + 'USDT&interval=1m&limit=61'); const s = Mizan.sigmaFromCloses(rows.map(r => +r[4])); if (isFinite(s) && s > 0) { coins[c].sigma = s; coins[c].sigmaAt = Date.now(); } } catch (e) {} }
  function onTrade(c, p, T) {
    const k = coins[c], R = Mizan.roundStart(T);
    if (R !== k.round) {
      const seenLive = k.round === R - Mizan.ROUND_MS && connectedSince <= R;
      k.round = R; k.path = []; k.ptb = NaN; k.ptbOk = false;
      if (seenLive) { k.ptb = p; k.ptbOk = true; } else loadRound(c, R);
    }
    k.last = p;
    const P = k.path; if (P.length && T - P[P.length - 1][0] < 250) P[P.length - 1][1] = p; else P.push([T, p]);
  }
  function connect() {
    if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
    let sock; try { sock = new WebSocket(HOSTS[hostIdx] + COINS.map(c => c.toLowerCase() + 'usdt@aggTrade').join('/')); } catch (e) { hostIdx = (hostIdx + 1) % HOSTS.length; retryLater(); return; }
    ws = sock; let opened = false;
    const openTimer = setTimeout(() => { if (!opened) { try { sock.close(); } catch (e) {} } }, 7000);
    sock.onopen = () => { opened = true; clearTimeout(openTimer); connected = true; connectedSince = now(); retry = 0; };
    sock.onmessage = ev => { lastMsgAt = Date.now(); let m; try { m = JSON.parse(ev.data); } catch (e) { return; } const d = m && (m.data || m); if (!d || d.e !== 'aggTrade' || !d.s) return; const c = d.s.replace(/USDT$/, ''); if (coins[c]) onTrade(c, +d.p, +d.T); };
    sock.onerror = () => {};
    sock.onclose = () => { clearTimeout(openTimer); if (ws !== sock) return; ws = null; connected = false; connectedSince = Infinity; if (!opened) hostIdx = (hostIdx + 1) % HOSTS.length; retryLater(); };
  }
  function retryLater() { setTimeout(connect, Math.min(10000, 1000 * Math.pow(2, retry++))); }
  function start() {
    if (started) return; started = true;
    syncTime(); connect(); COINS.forEach(loadSigma);
    setInterval(() => COINS.forEach(c => { if (Date.now() - coins[c].sigmaAt > 60000) loadSigma(c); }), 15000);
    setInterval(() => { if (connected && Date.now() - lastMsgAt > 10000 && ws) { try { ws.close(); } catch (e) {} } }, 3000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible') return; syncTime(); if (!ws) connect(); else if (Date.now() - lastMsgAt > 5000) { try { ws.close(); } catch (e) {} } });
  }
  const status = () => ({ connected, ageMs: lastMsgAt ? Date.now() - lastMsgAt : Infinity });
  return { coins, start, now, status };
})();

/* ---------- page ---------- */
(() => {
  const $ = id => document.getElementById(id);
  const KEY = 'mizan.v4', COINS = Object.keys(PARAMS.coins);
  const num = Mizan.parseNum, pctP = Mizan.pctP;
  const LRI = '⁦', PDI = '⁩';
  const mmss = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const hhmm = ms => { const d = new Date(ms); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const cache = new Map();
  const setText = (id, t) => { if (cache.get(id) !== t) { cache.set(id, t); $(id).textContent = t; } };
  const setHTML = (id, h) => { if (cache.get(id + '#h') !== h) { cache.set(id + '#h', h); $(id).innerHTML = h; } };
  const setClass = (id, c) => { if (cache.get(id + '#c') !== c) { cache.set(id + '#c', c); $(id).className = c; } };
  const tNow = () => LIVE ? Live.now() : Date.now();

  let st = {};
  try { st = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
  if (!PARAMS.coins[st.coin]) st.coin = 'BTC';
  st.bal = st.bal ?? '10'; st.goal = st.goal ?? '100';
  st.m = st.m || {}; COINS.forEach(c => st.m[c] = Object.assign({ dir: 'below', diff: '', at: 0, left: 0, round: 0, upQ: '', dnQ: '', qAt: 0, side: 'down', sellQ: '', sellAt: 0 }, st.m[c] || {}));
  st.mode = st.mode === 'hold' ? 'hold' : 'enter';
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  $('bal').value = st.bal; $('goal').value = st.goal;
  function loadCoin() {
    $('c' + st.coin).checked = true; const k = st.m[st.coin];
    $('diff').value = k.diff; (k.dir === 'above' ? $('dirAbove') : $('dirBelow')).checked = true;
    $('upQ').value = k.upQ; $('dnQ').value = k.dnQ; $('sellQ').value = k.sellQ;
    (k.side === 'up' ? $('hUp') : $('hDn')).checked = true;
    (st.mode === 'hold' ? $('mHold') : $('mEnter')).checked = true;
    $('enterBox').hidden = st.mode === 'hold'; $('holdBox').hidden = st.mode !== 'hold';
  }
  loadCoin();
  $('manual').hidden = LIVE; $('spark').hidden = !LIVE; $('liveLink').hidden = LIVE;

  function sigmaFor(c) { const s = LIVE ? Live.coins[c].sigma : NaN; return isFinite(s) ? s : PARAMS.coins[c].sigma; }
  function model(c, t) {
    if (LIVE) {
      const k = Live.coins[c], end = k.round ? k.round + Mizan.ROUND_MS : Mizan.roundEnd(t), tLeft = (end - t) / 1000;
      if (!k.round || !k.ptbOk || !isFinite(k.last)) return { ok: false, end, tLeft, wait: k.round ? 'يجيب سعر البداية…' : 'يتصل بـBinance…' };
      if (tLeft <= 0) return { ok: false, end, tLeft: 0, wait: 'ينتظر الجولة الجديدة…' };
      const diff = k.last - k.ptb;
      return { ok: true, end, tLeft, diff, pUp: Mizan.probUp(diff, tLeft, sigmaFor(c)) };
    }
    const k = st.m[c], end = Mizan.roundEnd(t), tLeft = (end - t) / 1000, d = num(k.diff);
    if (!isFinite(d)) return { ok: false, end, tLeft, wait: 'اكتب الفرق اللي جنب Current Price (السعر الحالي) في التطبيق.' };
    if (k.round !== end || (t - k.at) / 1000 > 15) return { ok: false, end, tLeft, wait: 'الفرق قديم. اكتبه من جديد.' };
    const diff = k.dir === 'above' ? d : -d;
    return { ok: true, end, tLeft, diff, pUp: Mizan.probUp(diff, k.left, sigmaFor(c)) };
  }

  document.addEventListener('input', e => {
    const id = e.target.id, t = tNow();
    if (id === 'bal' || id === 'goal') st[id] = e.target.value;
    if (id === 'upQ' || id === 'dnQ') {
      const k = st.m[st.coin]; k[id] = e.target.value; k.qAt = t;
      // fill the other side too, unless it was typed in the last few seconds
      k['typed_' + id] = t;
      const a = num(e.target.value), other = id === 'upQ' ? 'dnQ' : 'upQ';
      if (a > 0 && a < 100 && !(t - (k['typed_' + other] || 0) < 8000)) { $(other).value = String(Math.round((100 - a) * 10) / 10); k[other] = $(other).value; }
    }
    if (id === 'sellQ') { const k = st.m[st.coin]; k.sellQ = e.target.value; k.sellAt = t; }
    if (id === 'diff') {
      const k = st.m[st.coin];
      if (/[-−]/.test(e.target.value)) $('dirBelow').checked = true;
      if (/\+/.test(e.target.value)) $('dirAbove').checked = true;
      k.diff = e.target.value; k.dir = $('dirAbove').checked ? 'above' : 'below'; k.at = t; k.round = Mizan.roundEnd(t); k.left = (k.round - t) / 1000;
    }
    save(); render();
  });
  document.addEventListener('change', e => {
    if (e.target.name === 'coin') { st.coin = e.target.value; loadCoin(); }
    if (e.target.name === 'dir') st.m[st.coin].dir = e.target.value;
    if (e.target.name === 'mode') { st.mode = e.target.value; loadCoin(); }
    if (e.target.name === 'hside') st.m[st.coin].side = e.target.value;
    save(); render();
  });
  let wakeLock = null;
  async function keepAwake() { try { if (navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {} }
  if (LIVE) { document.addEventListener('pointerdown', keepAwake, { passive: true }); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); }); }

  let colors = null;
  function drawSpark(c) {
    const cv = $('spark'), k = Live.coins[c], dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight || 100;
    if (!w) return;
    if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); colors = null; }
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    if (!k.ptbOk || !k.path.length) return;
    if (!colors) { const cs = getComputedStyle(document.documentElement); colors = { up: cs.getPropertyValue('--up').trim(), down: cs.getPropertyValue('--down').trim(), muted: cs.getPropertyValue('--muted').trim() }; }
    const R = k.round, ptb = k.ptb, sig = sigmaFor(c);
    let dev = sig * 0.6; for (const p of k.path) dev = Math.max(dev, Math.abs(p[1] - ptb)); dev = (dev || 1) * 1.15;
    const mid = h / 2, X = t => Math.min(w, Math.max(0, ((t - R) / Mizan.ROUND_MS) * w)), Y = p => mid - ((p - ptb) / dev) * (mid - 8);
    ctx.setLineDash([4, 4]); ctx.strokeStyle = colors.muted; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke(); ctx.setLineDash([]);
    const last = k.path[k.path.length - 1][1];
    ctx.strokeStyle = last >= ptb ? colors.up : colors.down; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.beginPath();
    k.path.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
    ctx.stroke(); ctx.fillStyle = ctx.strokeStyle; ctx.beginPath(); ctx.arc(X(k.path[k.path.length - 1][0]), Y(last), 3.5, 0, 7); ctx.fill();
  }

  function render() {
    const t = tNow(), c = st.coin, m = model(c, t);
    // tabs: leading side per coin
    COINS.forEach(cc => {
      const mm = cc === c ? m : (LIVE ? model(cc, t) : { ok: false });
      const el = $('tab' + cc);
      if (mm.ok) { const up = mm.pUp >= 0.5; const txt = (up ? '↑ ' : '↓ ') + LRI + pctP(up ? mm.pUp : 1 - mm.pUp) + PDI; if (el.textContent !== txt) { el.textContent = txt; el.className = up ? 'up' : 'down'; } }
      else if (el.textContent !== '–') { el.textContent = '–'; el.className = ''; }
    });
    // header
    const left = m.tLeft;
    setText('clock', mmss(left)); $('clock').classList.toggle('late', left < PARAMS.sellCloseSec);
    setText('ttl', c + ' · جولة ' + hhmm(m.end - (LIVE ? Live.now() - Date.now() : 0)));
    setText('lockLbl', left > PARAMS.sellCloseSec ? 'الشراء يقفل بعد ' + mmss(left - PARAMS.buyCloseSec) : left > PARAMS.buyCloseSec ? 'البيع مقفل · الشراء يقفل بعد ' + mmss(left - PARAMS.buyCloseSec) : 'الشراء مقفل');
    if (LIVE) { const s = Live.status(), on = s.connected && s.ageMs < 5000; setClass('conn', 'conn ' + (on ? 'on' : 'off')); setText('connTxt', on ? 'لايف' : 'يعيد الاتصال…'); }
    else { setClass('conn', 'conn'); setText('connTxt', 'يدوي'); }
    // leading side
    if (m.ok) {
      const up = m.pUp >= 0.5, p = up ? m.pUp : 1 - m.pUp;
      setClass('lead', 'lead ' + (up ? 'up' : 'down'));
      setText('leadName', up ? '↑ الأقرب Up (طالع)' : '↓ الأقرب Down (نازل)');
      setText('leadPct', pctP(p));
      setText('leadOther', (up ? 'Down (نازل) ' : 'Up (طالع) ') + LRI + pctP(1 - p) + PDI);
      const ab = m.diff >= 0;
      setHTML('gapLine', 'السعر <b class="' + (ab ? 'pos' : 'neg') + '">' + (ab ? 'فوق' : 'تحت') + '</b> سعر البداية بـ<b class="num ' + (ab ? 'pos' : 'neg') + '">$' + Math.abs(m.diff).toFixed(2) + '</b>');
    } else {
      setClass('lead', 'lead'); setText('leadName', 'الأقرب'); setText('leadPct', '–'); setText('leadOther', ''); setText('gapLine', m.wait || '');
    }
    if (LIVE) drawSpark(c);
    // balance
    const bal = num(st.bal), goal = num(st.goal);
    let bankCls = 'msg', bankHTML;
    if (bal <= 0) { bankCls = 'msg stop'; bankHTML = '<b>خلص الرصيد. وقّف.</b>لا تودع من جديد.'; }
    else if (bal >= goal) { bankCls = 'msg good'; bankHTML = '<b>وصلت هدفك. اسحب ووقّف.</b>'; }
    else if (isFinite(bal) && isFinite(goal)) { const o = Mizan.reachOdds(bal, goal); bankHTML = 'فرصة إن ' + LRI + '$' + bal + PDI + ' تصير ' + LRI + '$' + goal + PDI + ' قبل لا تخلص: <b>' + (o < 0.01 ? LRI + '<1%' + PDI : LRI + Math.floor(o * 100) + '%' + PDI + ' أو أقل') + '</b>مهما كانت طريقة لعبك، ومع الرسوم أقل. إذا خلصت، وقّف ولا تودع.'; }
    else bankHTML = 'اكتب رصيدك وهدفك.';
    setClass('bankMsg', bankCls); setHTML('bankMsg', bankHTML);
    // the decision
    const k = st.m[c];
    const d = Mizan.decide({
      bal, goal, ok: m.ok, wait: m.wait, tLeft: left, pUp: m.pUp, mode: st.mode,
      upQ: num(k.upQ) / 100, dnQ: num(k.dnQ) / 100, qAge: k.qAt ? (t - k.qAt) / 1000 : 0,
      side: k.side, sellQ: num(k.sellQ) / 100, sellAge: k.sellAt ? (t - k.sellAt) / 1000 : 0,
    });
    setClass('decision', 'decision ' + d.kind); setText('dTitle', d.title); setText('dBody', d.body);
    // glance line: highest worthwhile price per side
    if (m.ok && left >= PARAMS.buyCloseSec && st.mode === 'enter') {
      const f = q => q > 0.01 ? LRI + Math.floor(q * 100) + '%' + PDI : 'ما يستاهل';
      setText('rule', 'Up (طالع) يستاهل تحت ' + f(Mizan.maxPrice(m.pUp)) + ' · Down (نازل) يستاهل تحت ' + f(Mizan.maxPrice(1 - m.pUp)));
    } else setText('rule', '');
  }

  render();
  if (LIVE) {
    Live.start();
    let last = 0;
    const loop = ts => { if (ts - last >= 200) { last = ts; render(); } requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    setInterval(() => { if (document.visibilityState === 'visible') render(); }, 1000);
  } else setInterval(render, 1000);
})();
</script>
</body>
