name: US prices for the paper test
on:
  schedule:
    - cron: '23 22 * * 1-5'   # after the US close
  workflow_dispatch:
permissions:
  contents: write
concurrency: us-prices
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_us.py
      - name: Commit if changed
        run: |
          git config user.name "us-prices-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update US prices"
          git push
